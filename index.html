      <style>
:root {
  color-scheme: light dark;

  --bg: #f2f4f7;
  --surface: #ffffff;
  --surface-muted: #f8fafc;
  --text: #0f172a;
  --muted: #64748b;
  --border: #e2e8f0;
  --divider: color-mix(in srgb, var(--muted) 60%, var(--border));
  --accent: #007ac9;
  --accent-strong: #0069ad;
  --accent-soft: rgba(0, 122, 201, 0.1);
  --danger: #b42318;
  --danger-soft: rgba(180, 35, 24, 0.08);
  --warning: #a15c00;
  --warning-soft: rgba(161, 92, 0, 0.09);
  --shadow: 0 16px 40px rgba(15, 23, 42, 0.18);
  --radius: 10px;

  --mode-bus: #007ac9;
  --mode-tram: #00885a;
  --mode-rail: #8c4799;
  --mode-subway: #c2410c;
  --mode-ferry: #007c94;
  --mode-other: #475569;
  --mode-off: #64748b;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0b1220;
    --surface: #111a2b;
    --surface-muted: #0e1626;
    --text: #e7edf7;
    --muted: #93a4bb;
    --border: #223047;
    --accent: #45a9ea;
    --accent-strong: #7cc4f3;
    --accent-soft: rgba(69, 169, 234, 0.15);
    --danger: #ff9b91;
    --danger-soft: rgba(255, 155, 145, 0.1);
    --warning: #f5c04a;
    --warning-soft: rgba(245, 192, 74, 0.12);
    --shadow: 0 18px 44px rgba(0, 0, 0, 0.45);
    --mode-off: #6b7a90;
  }
}

*,
*::before,
*::after {
  box-sizing: border-box;
}

[hidden] {
  display: none !important;
}

html {
  -webkit-text-size-adjust: 100%;
}

body {
  margin: 0;
  min-height: 100vh;
  background: var(--bg);
  color: var(--text);
  font-family:
    system-ui,
    -apple-system,
    'Segoe UI',
    Roboto,
    'Helvetica Neue',
    Arial,
    sans-serif;
  font-size: 16px;
  line-height: 1.4;
  -webkit-font-smoothing: antialiased;
}

.sprite {
  position: absolute;
  width: 0;
  height: 0;
  overflow: hidden;
}

.icon {
  width: 18px;
  height: 18px;
  display: block;
  flex: none;
}

.visually-hidden {
  position: absolute;
  width: 1px;
  height: 1px;
  margin: -1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
  border: 0;
}

.page {
  width: 100%;
  max-width: 980px;
  margin: 0 auto;
  padding: 20px 16px 24px;
}

/* ------------------------------- App bar ------------------------------- */

.appbar {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 10px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
}

.brand-mark {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex: none;
  height: 26px;
  padding: 0 7px;
  border-radius: 6px;
  background: var(--accent);
  color: #fff;
  font-size: 12px;
  font-weight: 750;
  letter-spacing: 0.04em;
}

h1 {
  margin: 0;
  font-size: 19px;
  font-weight: 700;
  letter-spacing: -0.015em;
  white-space: nowrap;
}

.key-settings {
  margin-left: 0;
  height: 28px;
  padding: 0 10px;
  border: 1px solid var(--border);
  border-radius: 7px;
  background: var(--surface);
  color: var(--muted);
  font: inherit;
  font-size: 12px;
  font-weight: 650;
  cursor: pointer;
}

.appbar-actions {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-left: auto;
}

.lang-switch {
  display: inline-flex;
  gap: 2px;
  padding: 2px;
  border: 1px solid var(--border);
  border-radius: 7px;
  background: var(--surface-muted);
}

.lang-button {
  min-width: 30px;
  height: 22px;
  padding: 0 5px;
  border: 0;
  border-radius: 5px;
  background: transparent;
  color: var(--muted);
  font: inherit;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.04em;
  cursor: pointer;
}

.lang-button[aria-pressed='true'] {
  background: var(--surface);
  color: var(--text);
  box-shadow: 0 1px 2px rgba(15, 23, 42, 0.14);
}

.lang-button:hover:not([aria-pressed='true']) {
  color: var(--accent);
}

.key-settings:hover {
  border-color: var(--accent);
  color: var(--accent);
}

/* -------------------------------- Form --------------------------------- */

.search {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px;
}

.search-grid {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 40px minmax(0, 1fr) auto auto;
  gap: 8px;
  align-items: end;
}

.field {
  position: relative;
  display: grid;
  grid-template-columns: 14px minmax(0, 1fr);
  column-gap: 6px;
  align-items: center;
  --label-gutter: 20px;
  min-width: 0;
}

.field label {
  display: block;
  max-height: 44px;
  margin: 0;
  padding: 0;
  overflow: hidden;
  color: var(--muted);
  font-size: 11px;
  font-weight: 650;
  letter-spacing: 0.02em;
  line-height: 1;
  text-transform: uppercase;
  white-space: nowrap;
  writing-mode: vertical-rl;
  transform: rotate(180deg);
  justify-self: center;
  align-self: center;
}

.input-wrap {
  position: relative;
  min-width: 0;
}

.field input {
  width: 100%;
  height: 44px;
  padding: 0 12px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--surface-muted);
  color: var(--text);
  font: inherit;
  font-size: 16px;
}

.field-from input {
  padding-right: 44px;
}

.field-from.has-clear input {
  padding-right: 80px;
}

.field-to input {
  padding-right: 42px;
}

.field.is-gps input {
  padding-left: 58px;
}

.field input::placeholder {
  color: var(--muted);
  opacity: 0.85;
}

.field input:hover {
  border-color: color-mix(in srgb, var(--muted) 45%, var(--border));
}

.field input:focus {
  outline: 2px solid var(--accent);
  outline-offset: 1px;
  border-color: transparent;
  background: var(--surface);
}

.field.is-invalid input {
  border-color: var(--danger);
  background: var(--danger-soft);
}

.icon-button {
  position: absolute;
  top: 50%;
  right: 5px;
  transform: translateY(-50%);
  display: grid;
  place-items: center;
  width: 32px;
  height: 32px;
  padding: 0;
  border: 0;
  border-radius: 7px;
  background: transparent;
  color: var(--muted);
  cursor: pointer;
}

.icon-button:hover {
  background: var(--accent-soft);
  color: var(--accent);
}

.icon-button:disabled {
  opacity: 0.5;
  cursor: progress;
}

/* The locate action takes the clear button's spot until there is text to clear. */
.field-from .icon-button {
  right: 6px;
}

.field-from.has-clear .icon-button {
  right: 42px;
}

.clear-button {
  position: absolute;
  top: 50%;
  right: 6px;
  transform: translateY(-50%);
  display: grid;
  place-items: center;
  width: 28px;
  height: 28px;
  padding: 0;
  border: 0;
  border-radius: 50%;
  background: color-mix(in srgb, var(--muted) 14%, transparent);
  color: var(--muted);
  cursor: pointer;
}

.clear-button:hover {
  background: var(--accent-soft);
  color: var(--accent);
}

.clear-button:disabled {
  opacity: 0.45;
  cursor: default;
}

.clear-button .icon {
  width: 12px;
  height: 12px;
}

.gps-tag {
  position: absolute;
  top: 50%;
  left: 10px;
  transform: translateY(-50%);
  padding: 1px 7px 2px;
  border-radius: 999px;
  background: var(--accent-soft);
  color: var(--accent-strong);
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.03em;
  line-height: 1.4;
  pointer-events: none;
  user-select: none;
}

.swap {
  display: grid;
  place-items: center;
  width: 40px;
  height: 44px;
  padding: 0;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--surface);
  color: var(--muted);
  cursor: pointer;
}

.swap:hover {
  border-color: var(--accent);
  color: var(--accent);
  background: var(--accent-soft);
}

.swap:disabled {
  opacity: 0.5;
  cursor: default;
}

.route-button {
  height: 44px;
  min-width: 104px;
  padding: 0 18px;
  border: 0;
  border-radius: 8px;
  background: var(--accent);
  color: #fff;
  font: inherit;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  transition:
    background-color 120ms ease,
    transform 80ms ease;
}

.route-button:hover {
  background: var(--accent-strong);
}

.route-button:active {
  transform: scale(0.99);
}

.route-button:disabled {
  cursor: progress;
  opacity: 0.75;
}

#route-button {
  height: 38px;
  margin-bottom: 3px;
}

:is(button, input):focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

@media (prefers-color-scheme: dark) {
  .route-button {
    color: #04101f;
  }
}

@media (prefers-reduced-motion: reduce) {
  .route-button {
    transition: none;
  }
}

.time-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px 8px;
}

.time-modes {
  display: inline-flex;
  gap: 2px;
  padding: 2px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--surface-muted);
}

.time-mode {
  padding: 4px 8px;
  border: 0;
  border-radius: 6px;
  background: transparent;
  color: var(--muted);
  font: inherit;
  font-size: 12.5px;
  font-weight: 600;
  cursor: pointer;
}

.time-mode[aria-pressed='true'] {
  background: var(--surface);
  color: var(--text);
  box-shadow: 0 1px 2px rgba(15, 23, 42, 0.14);
}

.time-mode:hover:not([aria-pressed='true']) {
  color: var(--accent);
}

.time-mode:disabled {
  cursor: default;
  opacity: 0.5;
}

.time-input {
  width: 74px;
  height: 32px;
  padding: 0 6px;
  border: 1px solid var(--border);
  border-radius: 7px;
  background: var(--surface-muted);
  color: var(--text);
  font: inherit;
  font-size: 14px;
  font-variant-numeric: tabular-nums;
  text-align: center;
}

.date-input {
  height: 32px;
  max-width: 150px;
  padding: 0 12px 0 10px;
  border: 1px solid var(--border);
  border-radius: 7px;
  background: var(--surface-muted);
  color: var(--text);
  font: inherit;
  font-size: 13px;
  cursor: pointer;
}

.date-input:focus {
  outline: 2px solid var(--accent);
  outline-offset: 1px;
  border-color: transparent;
  background: var(--surface);
}

.date-input:disabled {
  opacity: 0.45;
  cursor: default;
}

.date-input[aria-invalid='true'] {
  border-color: var(--danger);
  background: var(--danger-soft);
}

.time-input:focus {
  outline: 2px solid var(--accent);
  outline-offset: 1px;
  border-color: transparent;
  background: var(--surface);
}

.time-input:disabled {
  opacity: 0.45;
}

.time-input[aria-invalid='true'] {
  border-color: var(--danger);
  background: var(--danger-soft);
}

.time-input.is-past,
.date-input.is-past {
  outline: 2px solid var(--warning);
  outline-offset: 1px;
  border-color: transparent;
}

.time-warning {
  display: flex;
  align-items: center;
  gap: 6px;
  margin: 6px 2px 0;
  color: var(--warning);
  font-size: 12px;
  font-weight: 600;
}

.time-warning::before {
  content: '';
  flex: none;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: currentColor;
}

/* ------------------------------- Options ------------------------------- */

.options-toggle {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 44px;
  height: 44px;
  padding: 0;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--surface-muted);
  color: var(--muted);
  font: inherit;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
}

.options-toggle .icon {
  width: 18px;
  height: 18px;
}

.options-toggle:hover {
  border-color: var(--accent);
  color: var(--accent);
}

.options-toggle[aria-expanded='true'] {
  border-color: var(--accent);
  background: var(--accent-soft);
  color: var(--accent);
}

.options-panel {
  display: grid;
  gap: 8px;
  margin-top: 8px;
  padding-top: 10px;
  border-top: 1px solid var(--border);
}

.options-panel:not([hidden]) {
  animation: none;
}

@keyframes options-in {
  from {
    opacity: 0;
    transform: translateY(-2px);
  }
}

.option-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px 10px;
}

.option-label {
  color: var(--muted);
  font-size: 11px;
  font-weight: 650;
  letter-spacing: 0.02em;
  text-transform: uppercase;
}

.options-select {
  height: 32px;
  max-width: 210px;
  padding: 0 6px;
  border: 1px solid var(--border);
  border-radius: 7px;
  background: var(--surface-muted);
  color: var(--text);
  font: inherit;
  font-size: 13px;
  cursor: pointer;
}

.options-select:focus {
  outline: 2px solid var(--accent);
  outline-offset: 1px;
  border-color: transparent;
  background: var(--surface);
}

.mode-buttons {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.mode-toggle {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 32px;
  padding: 0 8px 0 4px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--surface-muted);
  color: var(--text);
  font: inherit;
  font-size: 11.5px;
  font-weight: 600;
  cursor: pointer;
}

.mode-toggle:hover {
  border-color: var(--accent);
}

.mode-toggle .mode-icon {
  width: 24px;
  height: 24px;
  flex: none;
}

.mode-toggle[data-mode='BUS'] .mode-icon {
  color: var(--mode-bus);
}

.mode-toggle[data-mode='TRAM'] .mode-icon {
  color: var(--mode-tram);
}

.mode-toggle[data-mode='RAIL'] .mode-icon {
  color: var(--mode-rail);
}

.mode-toggle[data-mode='SUBWAY'] .mode-icon {
  color: var(--mode-subway);
}

.mode-toggle[aria-pressed='false'] {
  color: var(--muted);
}

.mode-toggle[aria-pressed='false'] .mode-icon {
  color: var(--mode-off);
}

.options-toggle:disabled,
.options-select:disabled,
.mode-toggle:disabled {
  opacity: 0.5;
  cursor: default;
}

@media (prefers-reduced-motion: reduce) {
  .options-panel:not([hidden]) {
    animation: none;
  }
}

/* ----------------------------- Suggestions ----------------------------- */

.suggestions {
  position: absolute;
  top: calc(100% + 4px);
  left: var(--label-gutter);
  right: 0;
  z-index: 30;
  max-height: 280px;
  margin: 0;
  padding: 4px;
  overflow-y: auto;
  list-style: none;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  box-shadow: var(--shadow);
}

.suggestion {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
  padding: 7px 9px;
  border-radius: 6px;
  font-size: 13.5px;
  cursor: pointer;
}

.suggestion:hover,
.suggestion[aria-selected='true'] {
  background: var(--accent-soft);
}

.suggestion-label {
  min-width: 0;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}

.suggestion-kind {
  flex: none;
  color: var(--muted);
  font-size: 10px;
  font-weight: 650;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}

/* -------------------------------- Status ------------------------------- */

.status {
  display: flex;
  align-items: center;
  gap: 9px;
  margin-top: 12px;
  padding: 10px 12px;
  border: 1px solid var(--border);
  border-radius: 9px;
  background: var(--surface);
  color: var(--muted);
  font-size: 13.5px;
}

.status.is-error {
  border-color: color-mix(in srgb, var(--danger) 40%, var(--border));
  background: var(--danger-soft);
  color: var(--danger);
}

.spinner {
  flex: none;
  width: 14px;
  height: 14px;
  border: 2px solid currentColor;
  border-right-color: transparent;
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
}

@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}

@media (prefers-reduced-motion: reduce) {
  .spinner {
    animation-duration: 1.8s;
  }
}

/* ------------------------------- Results ------------------------------- */

.results {
  margin-top: 14px;
}

.results-head {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 0 2px 6px;
}

.results-head .pager {
  flex: 0 1 auto;
  margin: 0 0 0 auto;
  width: min(430px, 55%);
}

.results-head .pager-button {
  min-height: 30px;
  padding: 4px 8px;
}

.pager {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin: 0 0 6px;
}

.pager-bottom {
  margin: 6px 0 0;
}

.pager-button {
  flex: 1 1 0;
  min-width: 0;
  min-height: 32px;
  padding: 5px 8px;
  border: 1px solid var(--border);
  border-radius: 7px;
  background: var(--surface);
  color: var(--muted);
  font: inherit;
  font-size: 12px;
  font-weight: 600;
  line-height: 1.2;
  cursor: pointer;
}

.pager-button:hover:not(:disabled) {
  border-color: var(--accent);
  background: var(--accent-soft);
  color: var(--accent);
}

.pager-button:disabled {
  cursor: default;
  opacity: 0.5;
}

.pager-hsl-link {
  display: grid;
  place-items: center;
  flex: 0 0 auto;
  width: 32px;
  height: 32px;
  border-radius: 7px;
  background: #007ac9;
  color: #ffffff;
  text-decoration: none;
}

.pager-hsl-link:hover {
  background: #0069ad;
}

.pager-hsl-link .icon {
  width: 22px;
  height: 22px;
}

/* A single bordered list reads like a timetable rather than five cards. */
.itinerary-list {
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface);
}

.itinerary {
  margin: 0;
  padding: 8px 12px 6px;
  border: 0;
  border-radius: 0;
  background: transparent;
}

.itinerary + .itinerary {
  border-top: 2px solid var(--divider);
}

.itinerary-head {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 2px 10px;
}

.itinerary-times {
  display: flex;
  align-items: baseline;
  gap: 5px;
  font-size: 17px;
  font-weight: 700;
  letter-spacing: -0.02em;
  font-variant-numeric: tabular-nums;
}

.itinerary-arrow {
  color: var(--muted);
  font-size: 13px;
  font-weight: 500;
  transform: translateY(-1px);
}

.itinerary-duration {
  flex: none;
  margin-left: auto;
  padding: 1px 8px;
  border-radius: 999px;
  background: var(--accent-soft);
  color: var(--accent-strong);
  font-size: 12px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}

.itinerary-meta {
  display: flex;
  flex: 1 1 0;
  flex-wrap: wrap;
  align-items: center;
  align-self: center;
  position: relative;
  top: 0.05em;
  gap: 2px 6px;
  min-width: 0;
  margin: 0;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.35;
}

.meta-dot {
  width: 3px;
  height: 3px;
  border-radius: 50%;
  background: currentColor;
  opacity: 0.55;
}

.live {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  color: #12805c;
  font-weight: 600;
}

@media (prefers-color-scheme: dark) {
  .live {
    color: #4ade9f;
  }
}

.live-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: currentColor;
  box-shadow: 0 0 0 3px color-mix(in srgb, currentColor 18%, transparent);
}

/* -------------------------------- Steps -------------------------------- */

.steps {
  margin: 4px 0 0;
  padding: 0;
  list-style: none;
}

.step {
  display: grid;
  grid-template-columns: 34px minmax(0, 1fr) auto;
  gap: 8px;
  align-items: center;
  padding: 4px 0;
}

.step + .step {
  border-top: 1px solid color-mix(in srgb, var(--border) 65%, transparent);
}

.step-marker {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 34px;
}

.walk-marker {
  display: grid;
  place-items: center;
  width: 24px;
  height: 24px;
  border: 1px solid var(--border);
  border-radius: 50%;
  background: var(--surface-muted);
  color: var(--muted);
}

.walk-marker .icon {
  width: 13px;
  height: 13px;
}

.line-badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 28px;
  max-width: 34px;
  height: 24px;
  padding: 0 5px;
  overflow: hidden;
  border-radius: 6px;
  background: var(--mode-bus);
  color: #fff;
  font-size: 12px;
  font-weight: 750;
  letter-spacing: 0.01em;
  white-space: nowrap;
  text-overflow: ellipsis;
  font-variant-numeric: tabular-nums;
}

.mode-bus {
  background: var(--mode-bus);
}
.mode-tram {
  background: var(--mode-tram);
}
.mode-rail {
  background: var(--mode-rail);
}
.mode-subway {
  background: var(--mode-subway);
}
.mode-ferry {
  background: var(--mode-ferry);
}
.mode-other {
  background: var(--mode-other);
}

.step-body {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  column-gap: 6px;
  min-width: 0;
}

.step-title {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 13.5px;
  font-weight: 630;
}

.step-title .live {
  font-weight: 500;
  font-size: 10.5px;
}

.step-timing .live {
  align-self: center;
  font-weight: 500;
  font-size: 10.5px;
}

.step-detail {
  min-width: 0;
  color: var(--muted);
  font-size: 12.5px;
  line-height: 1.35;
  overflow-wrap: anywhere;
}

.location-link {
  color: inherit;
  text-decoration: underline;
  text-decoration-style: dotted;
  text-underline-offset: 2px;
}

.step-timing {
  display: flex;
  flex-direction: row;
  align-items: baseline;
  gap: 5px;
  text-align: right;
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}

.step-duration {
  font-size: 12.5px;
  font-weight: 650;
}

.step-time {
  color: var(--muted);
  font-size: 11px;
}

.step-wait {
  padding: 2px 0;
}

.step-wait .step-detail {
  color: var(--muted);
  font-size: 11.5px;
  font-style: italic;
}

/* -------------------------------- Footer ------------------------------- */

.footer {
  margin-top: 16px;
  padding-top: 8px;
  border-top: 1px solid var(--border);
  color: var(--muted);
  font-size: 11px;
  text-align: center;
}

.footer p {
  margin: 2px 0;
}

.footer a {
  color: inherit;
  text-decoration-color: color-mix(in srgb, currentColor 40%, transparent);
  text-underline-offset: 2px;
}

.footer a:hover {
  color: var(--accent);
}

.noscript {
  max-width: 980px;
  margin: 0 auto;
  padding: 0 16px;
  color: var(--danger);
}

/* ------------------------------ API key dialog -------------------------- */

.key-dialog {
  width: min(420px, calc(100vw - 28px));
  padding: 18px;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: var(--surface);
  color: var(--text);
}

.key-dialog::backdrop {
  background: rgba(15, 23, 42, 0.5);
}

.key-dialog h2 {
  margin: 0 0 6px;
  font-size: 17px;
  font-weight: 700;
}

.key-help {
  margin: 0 0 10px;
  color: var(--muted);
  font-size: 12.5px;
  line-height: 1.45;
}

#key-input {
  width: 100%;
  height: 42px;
  padding: 0 10px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--surface-muted);
  color: var(--text);
  font: inherit;
  font-size: 16px;
}

#key-input:focus {
  outline: 2px solid var(--accent);
  outline-offset: 1px;
  border-color: transparent;
  background: var(--surface);
}

.key-error {
  margin: 8px 0 0;
  color: var(--danger);
  font-size: 12.5px;
}

.key-actions {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  margin-top: 12px;
}

.key-cancel,
.key-save {
  height: 38px;
  padding: 0 14px;
  border-radius: 8px;
  font: inherit;
  font-size: 13.5px;
  font-weight: 650;
  cursor: pointer;
}

.key-cancel {
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text);
}

.key-save {
  border: 0;
  background: var(--accent);
  color: #fff;
}

@media (prefers-color-scheme: dark) {
  .key-save {
    color: #04101f;
  }
}

/* ------------------------------ Small screens -------------------------- */

@media (max-width: 680px) {
  .page {
    padding: 12px 10px 18px;
  }

  .appbar {
    margin-bottom: 8px;
  }

  h1 {
    font-size: 17px;
  }

  .brand-mark {
    height: 24px;
    font-size: 12px;
  }

  .search {
    padding: 10px;
  }

  .search-grid {
    grid-template-columns: 44px minmax(0, 1fr) 44px;
    grid-template-areas:
      'from from from'
      'to to to'
      'swap route options';
    gap: 8px;
  }

  .field-from {
    grid-area: from;
  }

  .field-to {
    grid-area: to;
  }

  .swap {
    grid-area: swap;
    width: 44px;
  }

  .route-button {
    grid-area: route;
    width: 100%;
  }

  .options-toggle {
    grid-area: options;
  }

  .time-mode {
    flex: 1 1 0;
    min-height: 20px;
    padding: 6px 9px;
  }

  .time-modes {
    flex: 1 1 100%;
  }

  .mode-toggle,
  .options-select {
    height: 40px;
  }

  .options-select {
    font-size: 16px;
  }

  .mode-buttons {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    width: 100%;
  }

  .mode-toggle {
    justify-content: flex-start;
    min-width: 0;
  }

  .mode-toggle .mode-icon {
    width: 28px;
    height: 28px;
  }

  /* 16px prevents iOS from zooming the page when a field is focused. */
  .time-input,
  .date-input {
    height: 40px;
    font-size: 16px;
  }

  .time-input {
    width: 78px;
  }

  .date-input {
    max-width: 142px;
  }

  .clear-button {
    width: 32px;
    height: 32px;
  }

  .field-to input {
    padding-right: 46px;
  }

  .results {
    margin-top: 10px;
  }

  .results-head {
    flex-wrap: wrap;
  }

  .results-head .pager {
    width: 100%;
    margin: 2px 0 0;
  }

  .pager {
    flex-wrap: nowrap;
  }

  .pager-button {
    min-height: 44px;
    padding: 8px 6px;
  }

  .pager-hsl-link {
    width: 44px;
    height: 44px;
  }

  .itinerary {
    padding: 8px 10px 4px;
  }

  .itinerary-times {
    font-size: 16px;
  }

  .step {
    grid-template-columns: 34px minmax(0, 1fr) auto;
    gap: 8px;
  }

  .step-marker {
    width: 34px;
  }

  .footer {
    margin-top: 14px;
    padding-top: 8px;
  }
}

@media (max-width: 360px) {
  .step-detail {
    font-size: 12px;
  }

  .itinerary-meta {
    font-size: 11.5px;
  }
}

  try {

    if (value === 'fi' || value === 'en') return value;
  } catch {

  }
  return 'fi';
}

function t(key, ...args) {
  const table = I18N[lang] || I18N.fi;
  const value = table[key] ?? I18N.en[key] ?? key;
  return typeof value === 'function' ? value(...args) : value;
}

function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}

function icon(id) {
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('class', 'icon');
  svg.setAttribute('aria-hidden', 'true');
  const use = document.createElementNS('http://www.w3.org/2000/svg', 'use');
  use.setAttribute('href', `#${id}`);
  svg.append(use);
  return svg;
}

function formatTime(ms) {
  const value = Number(ms);
  if (!Number.isFinite(value)) return '--:--';
  return timeFormatter.format(new Date(value));
}

function formatDay(ms) {
  const value = Number(ms);
  if (!Number.isFinite(value)) return '';
  return dayFormatter.format(new Date(value));
}

function formatDuration(seconds) {
  const totalMinutes = Math.max(1, Math.round(Number(seconds || 0) / 60));
  if (totalMinutes < 60) return `${totalMinutes} min`;
  const hours = Math.floor(totalMinutes / 60);
  const minutes = totalMinutes % 60;
  return minutes ? `${hours} h ${minutes} min` : `${hours} h`;
}

function formatDistance(meters) {
  const value = Number(meters || 0);
  if (value < 1000) return `${Math.max(10, Math.round(value / 10) * 10)} m`;
  return `${(value / 1000).toFixed(1)} km`;
}

function addDays(dateString, days) {
  const [year, month, day] = dateString.split('-').map(Number);
  const date = new Date(Date.UTC(year, month - 1, day + days));
  return date.toISOString().slice(0, 10);
}

function relativeDayLabel(ms) {
  const value = Number(ms);
  if (!Number.isFinite(value)) return '';
  const today = dayFormatter.format(new Date());
  const day = dayFormatter.format(new Date(value));
  if (day === today) return '';
  if (day === addDays(today, 1)) return t('tomorrowOption');
  if (day === addDays(today, -1)) return t('yesterday');
  return weekdayFormatter.format(new Date(value));
}

function modeInfo(mode) {
  const info = MODES[mode] || { key: 'modeTransit', className: 'mode-other' };
  return { label: t(info.key), className: info.className };
}

// ---------------------------------------------------------------------------
// API access
//
// The default build talks to the same-origin Node proxy, which keeps the
// subscription key on the server. The standalone build sets
// window.__HSL_STANDALONE__ and talks to Digitransit directly with a key the
// user stores in this browser.
// ---------------------------------------------------------------------------

const STANDALONE = window.__HSL_STANDALONE__ === true;
const KEY_STORAGE = 'reitintin:api-key';
const ROUTING_URL = 'https://api.digitransit.fi/routing/v2/hsl/gtfs/v1';
const GEOCODING_URL = 'https://api.digitransit.fi/geocoding/v1';
const MAX_ITINERARIES = 5;
const UPSTREAM_TIMEOUT_MS = 15000;

// Keep geocoding inside the nine HSL member municipalities, so a name that
// also exists elsewhere (for example "Löylytie 11") cannot resolve out of area.
const HSL_BOUNDS = {
  minLat: 59.78,
  maxLat: 60.58,
  minLon: 23.75,
  maxLon: 25.65,
};

function normaliseName(value) {
  return String(value || '')
    .trim()
    .toLowerCase()
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '');
}

const HSL_MUNICIPALITIES = new Set(
  [
    'Helsinki',
    'Helsingfors',
    'Espoo',
    'Esbo',
    'Vantaa',
    'Vanda',
    'Kauniainen',
    'Grankulla',
    'Kirkkonummi',
    'Kyrkslätt',
    'Siuntio',
    'Sjundeå',
    'Sipoo',
    'Sibbo',
    'Kerava',
    'Kervo',
    'Tuusula',
    'Tusby',
  ].map(normaliseName),
);

function isInHslArea(place) {
  const names = [place.localadmin, place.locality].filter(Boolean);
  if (!names.length) return null;
  return names.some((name) => HSL_MUNICIPALITIES.has(normaliseName(name)));
}

class ApiError extends Error {
  constructor(message, code) {
    super(message);
    this.code = code;
  }
}

function readStoredKey() {
  try {
    const value = localStorage.getItem(KEY_STORAGE);
    if (value) return value;
  } catch {
    // Storage can be unavailable or blocked on file:// in some browsers.
  }
  try {
    return sessionStorage.getItem(KEY_STORAGE) || '';
  } catch {
    return '';
  }
}

const DEFAULT_KEY =
  typeof window.__HSL_DEFAULT_KEY__ === 'string' ? window.__HSL_DEFAULT_KEY__.trim() : '';

let apiKey = STANDALONE ? readStoredKey().trim() || DEFAULT_KEY : '';

function saveStoredKey(value) {
  apiKey = value;
  try {
    localStorage.setItem(KEY_STORAGE, value);
    return;
  } catch {
    // Fall through to session storage, then memory only.
  }
  try {
    sessionStorage.setItem(KEY_STORAGE, value);
  } catch {
    // The in-memory key still works for this page.
  }
}

const apiCache = new Map();
const API_CACHE_LIMIT = 300;

function cacheGet(key) {
  const hit = apiCache.get(key);
  if (!hit) return null;
  if (hit.expires < Date.now()) {
    apiCache.delete(key);
    return null;
  }
  return hit.value;
}

function cacheSet(key, value, ttlMs) {
  if (apiCache.size >= API_CACHE_LIMIT) {
    apiCache.delete(apiCache.keys().next().value);
  }
  apiCache.set(key, { value, expires: Date.now() + ttlMs });
}

function directHeaders(extra = {}) {
  if (!apiKey) {
    throw new ApiError(t('addApiKey'), 'NO_KEY');
  }
  return { 'digitransit-subscription-key': apiKey, ...extra };
}

async function directJson(url, options = {}, signal) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), UPSTREAM_TIMEOUT_MS);
  const forwardAbort = () => controller.abort();
  if (signal) {
    if (signal.aborted) controller.abort();
    else signal.addEventListener('abort', forwardAbort, { once: true });
  }

  let response;
  try {
    response = await fetch(url, { ...options, signal: controller.signal });
  } catch (error) {
    if (signal?.aborted) throw error;
    if (error.name === 'AbortError') {
      throw new ApiError(t('timeout'), 'TIMEOUT');
    }
    throw new ApiError(t('networkDirect'), 'NETWORK');
  } finally {
    clearTimeout(timer);
    signal?.removeEventListener('abort', forwardAbort);
  }

  let data = null;
  try {
    data = await response.json();
  } catch {
    // Leave data null and fall back to the HTTP status below.
  }

  if (!response.ok) {
    if (response.status === 401 || response.status === 403) {
      throw new ApiError(t('authRejected'), 'AUTH');
    }
    if (response.status === 429) {
      throw new ApiError(t('rateLimit'), 'RATE');
    }
    throw new ApiError(
      data?.error || t('httpApi', response.status),
      'HTTP',
    );
  }
  return data;
}

const LAYER_LABELS = {
  address: 'layerAddress',
  venue: 'layerVenue',
  street: 'layerStreet',
  stop: 'layerStop',
  station: 'layerStation',
  neighbourhood: 'layerNeighbourhood',
  locality: 'layerLocality',
  region: 'layerRegion',
  country: 'layerCountry',
};

function layerKind(layer) {
  return LAYER_LABELS[layer] ? t(LAYER_LABELS[layer]) : '';
}

function recentPlaceForStorage(place) {
  return {
    label: String(place.label || ''),
    name: String(place.name || place.label || ''),
    layer: String(place.layer || ''),
    locality: String(place.locality || ''),
    localadmin: String(place.localadmin || ''),
    lat: Number(place.lat),
    lon: Number(place.lon),
    gps: place.gps === true,
  };
}

function normaliseRecentPlace(raw) {
  if (!raw || typeof raw !== 'object') return null;
  const label = String(raw.label || '').trim();
  const lat = Number(raw.lat);
  const lon = Number(raw.lon);
  if (!label || !Number.isFinite(lat) || !Number.isFinite(lon)) return null;
  return {
    label,
    name: String(raw.name || label),
    layer: String(raw.layer || ''),
    kind: layerKind(raw.layer),
    locality: String(raw.locality || ''),
    localadmin: String(raw.localadmin || ''),
    lat,
    lon,
    gps: raw.gps === true,
  };
}

function readRecentPlaces(scope) {
  try {
    const raw = JSON.parse(localStorage.getItem(RECENT_STORAGE_PREFIX + scope) || '[]');
    if (!Array.isArray(raw)) return [];
    return raw.map(normaliseRecentPlace).filter(Boolean).slice(0, RECENT_PLACES_LIMIT);
  } catch {
    return [];
  }
}

function writeRecentPlaces(scope, places) {
  try {
    localStorage.setItem(
      RECENT_STORAGE_PREFIX + scope,
      JSON.stringify(places.map(recentPlaceForStorage)),
    );
  } catch {
    // Storage can be unavailable; keep the in-memory list for this session.
  }
}

function normaliseFeature(feature) {
  const properties = feature?.properties ?? {};
  const coordinates = feature?.geometry?.coordinates;
  if (!Array.isArray(coordinates) || coordinates.length < 2) return null;
  const [lon, lat] = coordinates.map(Number);
  if (!Number.isFinite(lat) || !Number.isFinite(lon)) return null;
  return {
    label: properties.label || properties.name || t('unknownPlace'),
    name: properties.name || properties.label || t('unknownPlace'),
    layer: properties.layer || '',
    kind: layerKind(properties.layer),
    locality: properties.locality || '',
    localadmin: properties.localadmin || '',
    lat,
    lon,
  };
}

function geocodeParams(text, focus) {
  const params = new URLSearchParams({
    text,
    size: '10',
    'boundary.country': 'FIN',
    'boundary.rect.min_lat': String(HSL_BOUNDS.minLat),
    'boundary.rect.max_lat': String(HSL_BOUNDS.maxLat),
    'boundary.rect.min_lon': String(HSL_BOUNDS.minLon),
    'boundary.rect.max_lon': String(HSL_BOUNDS.maxLon),
  });
  if (Number.isFinite(focus?.lat) && Number.isFinite(focus?.lon)) {
    params.set('focus.point.lat', String(focus.lat));
    params.set('focus.point.lon', String(focus.lon));
  }
  return params;
}

function filterGeocodeFeatures(json) {
  const seen = new Set();
  const results = [];
  for (const feature of json?.features ?? []) {
    const place = normaliseFeature(feature);
    if (!place || seen.has(place.label) || isInHslArea(place) !== true) continue;
    seen.add(place.label);
    results.push(place);
  }
  return results.slice(0, SUGGESTION_LIMIT);
}

async function directGeocode(text, focus, signal) {
  const params = geocodeParams(text, focus);
  const cacheKey = `geocode:${params}`;
  const cached = cacheGet(cacheKey);
  if (cached) return cached;

  const json = await directJson(`${GEOCODING_URL}/search?${params}`, {
    headers: directHeaders(),
  }, signal);
  const results = filterGeocodeFeatures(json);
  cacheSet(cacheKey, results, 10 * 60 * 1000);
  return results;
}

async function directReverse(lat, lon) {
  const params = new URLSearchParams({
    'point.lat': String(lat),
    'point.lon': String(lon),
    size: '1',
    'boundary.country': 'FIN',
  });
  const cacheKey = `reverse:${lat.toFixed(4)},${lon.toFixed(4)}`;
  const cached = cacheGet(cacheKey);
  if (cached) return cached;

  const json = await directJson(`${GEOCODING_URL}/reverse?${params}`, {
    headers: directHeaders(),
  });
  const place = normaliseFeature(json?.features?.[0]);
  const result = {
    label: place?.label ?? null,
    inHslArea: place ? isInHslArea(place) : null,
  };
  cacheSet(cacheKey, result, 60 * 60 * 1000);
  return result;
}

// Keep in sync with PLAN_QUERY in server.mjs; both transports must request the
// same fields so the renderer sees an identical shape.
const PLAN_QUERY = `
  query Plan(
    $from: InputCoordinates!
    $to: InputCoordinates!
    $num: Int!
    $date: String
    $time: String
    $arriveBy: Boolean
    $transportModes: [TransportMode]
    $walkSpeed: Float
  ) {
    plan(
      from: $from
      to: $to
      numItineraries: $num
      date: $date
      time: $time
      arriveBy: $arriveBy
      transportModes: $transportModes
      walkSpeed: $walkSpeed
      locale: "en"
    ) {
      itineraries {
        duration
        startTime
        endTime
        walkDistance
        walkTime
        waitingTime
        legs {
          mode
          transitLeg
          startTime
          endTime
          duration
          distance
          realTime
          route {
            shortName
            longName
            mode
          }
          trip {
            tripHeadsign
          }
          from {
            name
            lat
            lon
            stop {
              code
              platformCode
            }
          }
          to {
            name
            lat
            lon
            stop {
              code
              platformCode
            }
          }
        }
      }
    }
  }
`;

function buildTransportModes(modes) {
  const enabled = new Set(
    (Array.isArray(modes) ? modes : DEFAULT_TRANSIT_MODES).filter((mode) =>
      TOGGLEABLE_TRANSIT_MODES.has(mode),
    ),
  );
  return [
    { mode: 'WALK' },
    ...DEFAULT_TRANSIT_MODES.filter((mode) => enabled.has(mode)).map((mode) => ({ mode })),
    // Ferries are always allowed, even though they have no toggle.
    { mode: 'FERRY' },
  ];
}

async function directPlan(from, to, timing = {}, options = {}) {
  const coordinates = (place) => ({
    lat: Number(place?.lat),
    lon: Number(place?.lon),
  });
  const start = coordinates(from);
  const end = coordinates(to);

  if (
    Number.isFinite(start.lat) &&
    Number.isFinite(start.lon) &&
    start.lat.toFixed(5) === end.lat.toFixed(5) &&
    start.lon.toFixed(5) === end.lon.toFixed(5)
  ) {
    throw new ApiError(t('samePlace'), 'SAME');
  }

  const variables = {
    from: start,
    to: end,
    num: MAX_ITINERARIES,
    transportModes: buildTransportModes(options.modes),
  };
  if (timing.date && timing.time) {
    variables.date = timing.date;
    variables.time = timing.time;
    variables.arriveBy = Boolean(timing.arriveBy);
  }
  if (Number.isFinite(options.walkSpeed)) {
    variables.walkSpeed = options.walkSpeed;
  }

  const json = await directJson(ROUTING_URL, {
    method: 'POST',
    headers: directHeaders({ 'Content-Type': 'application/json' }),
    body: JSON.stringify({ query: PLAN_QUERY, variables }),
  });

  if (Array.isArray(json?.errors) && json.errors.length) {
    throw new ApiError(
      t('routingFailed', json.errors[0]?.message || t('routingFailedFallback')),
      'ROUTING',
    );
  }
  return { itineraries: json?.data?.plan?.itineraries ?? [] };
}

async function proxyJson(pathname, options, signal) {
  let response;
  try {
    response = await fetch(pathname, { ...options, signal });
  } catch (error) {
    if (error.name === 'AbortError') throw error;
    throw new ApiError(t('networkProxy'), 'NETWORK');
  }

  let data = null;
  try {
    data = await response.json();
  } catch {
    // Leave data null and fall back to the HTTP status below.
  }

  if (!response.ok) {
    throw new ApiError(data?.error || t('httpRequest', response.status), 'HTTP');
  }
  return data;
}

async function proxyGeocode(text, focus, signal) {
  const params = new URLSearchParams({ text });
  if (focus) {
    params.set('lat', String(focus.lat));
    params.set('lon', String(focus.lon));
  }
  const data = await proxyJson(`/api/geocode?${params}`, undefined, signal);
  return Array.isArray(data?.results) ? data.results : [];
}

function proxyReverse(lat, lon) {
  return proxyJson(`/api/reverse?lat=${lat}&lon=${lon}`);
}

function proxyPlan(from, to, timing, options = {}) {
  const body = { from, to };
  if (timing?.date && timing?.time) {
    body.date = timing.date;
    body.time = timing.time;
    body.arriveBy = Boolean(timing.arriveBy);
  }
  if (Array.isArray(options.modes)) body.modes = options.modes;
  if (Number.isFinite(options.walkSpeed)) body.walkSpeed = options.walkSpeed;
  return proxyJson('/api/plan', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
}

const api = STANDALONE
  ? { geocode: directGeocode, reverse: directReverse, plan: directPlan }
  : { geocode: proxyGeocode, reverse: proxyReverse, plan: proxyPlan };

async function geocodePlaces(text, focus, signal) {
  const results = await api.geocode(text, focus, signal);
  return Array.isArray(results) ? results.slice(0, SUGGESTION_LIMIT) : [];
}

function requestPlan(from, to, timing, options) {
  return api.plan(from, to, timing, options);
}


async function reverseLabel(lat, lon) {
  try {
    const data = await api.reverse(lat, lon);
    return data && typeof data === 'object' ? data : null;
  } catch {
    return null;
  }
}

function getPosition() {
  return new Promise((resolve, reject) => {
    if (!navigator.geolocation) {
      reject(new Error(t('geoUnavailable')));
      return;
    }
    navigator.geolocation.getCurrentPosition(
      (position) => resolve({ lat: position.coords.latitude, lon: position.coords.longitude }),
      (error) => {
        reject(
          new Error(
            error.code === error.PERMISSION_DENIED ? t('geoDenied') : t('geoFailed'),
          ),
        );
      },
      { enableHighAccuracy: true, timeout: 10000, maximumAge: 30000 },
    );
  });
}

async function locateSelection() {
  const position = await getPosition();
  const reverse = await reverseLabel(position.lat, position.lon);
  if (reverse?.inHslArea === false) {
    throw new Error(t('geoOutside'));
  }
  const address = reverse?.label;
  return {
    label: address || '',
    lat: position.lat,
    lon: position.lon,
    gps: true,
  };
}

const DATE_OPTION_COUNT = 14;

function todayDate() {
  return dayFormatter.format(new Date());
}

function dateToEpoch(dateString) {
  return new Date(`${dateString}T12:00:00Z`).getTime();
}

function buildDateOptions() {
  const today = todayDate();
  const selected = dateInput.value;
  dateInput.replaceChildren();

  for (let index = 0; index < DATE_OPTION_COUNT; index += 1) {
    const date = addDays(today, index);
    const option = document.createElement('option');
    option.value = date;
    if (index === 0) {
      option.textContent = t('today');
    } else if (index === 1) {
      option.textContent = t('tomorrowOption');
    } else {
      option.textContent = weekdayFormatter.format(dateToEpoch(date));
    }
    dateInput.append(option);
  }

  if (Array.from(dateInput.options).some((option) => option.value === selected)) {
    dateInput.value = selected;
  }
}

function parseTimeValue(value) {
  const raw = String(value || '').trim();
  const match = raw.match(/^(\d{1,2}):(\d{2})$/) || raw.match(/^(\d{2})(\d{2})$/);
  if (!match) return null;
  const hours = Number(match[1]);
  const minutes = Number(match[2]);
  if (hours > 23 || minutes > 59) return null;
  return `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}`;
}

/** Keep only four digits and place the colon after the hours. */
function formatTimeDigits(value) {
  const digits = String(value || '').replace(/\D/g, '').slice(0, 4);
  if (digits.length <= 2) return digits;
  return `${digits.slice(0, 2)}:${digits.slice(2)}`;
}

function normalizeTimeInput() {
  const formatted = formatTimeDigits(timeInput.value);
  if (formatted.length === 5) timeInput.value = formatted;
}

function updatePastWarning() {
  if (timeMode === 'now') {
    timeWarning.hidden = true;
    timeInput.classList.remove('is-past');
    dateInput.classList.remove('is-past');
    return;
  }

  const value = parseTimeValue(timeInput.value);
  const date = dateInput.value;
  const today = todayDate();
  const nowTime = timeFormatter.format(new Date());
  const validDate = /^\d{4}-\d{2}-\d{2}$/.test(date);
  const datePast = validDate && date < today;
  const timePast = validDate && date === today && Boolean(value) && value < nowTime;

  timeWarning.hidden = !(datePast || timePast);
  dateInput.classList.toggle('is-past', datePast);
  timeInput.classList.toggle('is-past', timePast);
}

function timingLabel(date, time, arriveBy) {
  if (!date || !time) return t('leavingNow');
  const value = String(time).slice(0, 5);
  const prefix = arriveBy ? t('arriveByPrefix') : t('departAtPrefix');
  const today = todayDate();
  let suffix = '';
  if (date === addDays(today, 1)) {
    suffix = ` ${t('tomorrowLabel')}`;
  } else if (date !== today) {
    suffix = ` ${t('onDatePrefix')}${weekdayFormatter.format(dateToEpoch(date))}`;
  }
  return `${prefix} ${value}${suffix}`;
}

function timeFieldError(message, field) {
  const error = new Error(message);
  error.field = field;
  return error;
}

function computeWhen(requireTime = true) {
  if (timeMode === 'now') {
    return { date: null, time: null, arriveBy: false, label: t('leavingNow'), past: false };
  }

  const value = parseTimeValue(timeInput.value);
  if (!value) {
    if (!requireTime) return null;
    throw timeFieldError(t('errorTimeFormat'), 'time');
  }

  const date = dateInput.value;
  if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) {
    if (!requireTime) return null;
    throw timeFieldError(t('errorChooseDate'), 'date');
  }

  const today = todayDate();
  const nowTime = timeFormatter.format(new Date());
  const past = date < today || (date === today && value < nowTime);

  return {
    date,
    time: `${value}:00`,
    arriveBy: timeMode === 'arrive',
    label: timingLabel(date, value, timeMode === 'arrive'),
    past,
  };
}

function setTimeMode(mode, { focus = false, preserveTime = false } = {}) {
  const previousMode = timeMode;
  timeMode = mode;

  for (const button of timeModeButtons) {
    const active = button.dataset.timeMode === mode;
    button.classList.toggle('is-active', active);
    button.setAttribute('aria-pressed', String(active));
  }

  if (mode === 'now') {
    updatePastWarning();
    return;
  }

  // A value picked when the page was opened may already be in the past.
  // Choosing a scheduled mode for the first time should give a usable time,
  // unless the user has already typed a value.
  if (previousMode === 'now' && !preserveTime) {
    const current = parseTimeValue(timeInput.value);
    if (dateInput.value === todayDate() && (!current || current <= timeFormatter.format(new Date()))) {
      timeInput.value = timeFormatter.format(new Date());
    }
  }

  if (focus) {
    timeInput.focus();
    timeInput.select();
  }

  updatePastWarning();
}

for (const button of timeModeButtons) {
  button.addEventListener('click', () => setTimeMode(button.dataset.timeMode, { focus: true }));
}

timeInput.addEventListener('input', () => {
  if (timeMode === 'now') setTimeMode('depart', { preserveTime: true });
  const formatted = formatTimeDigits(timeInput.value);
  if (timeInput.value !== formatted) {
    timeInput.value = formatted;
    if (document.activeElement === timeInput) {
      timeInput.setSelectionRange?.(formatted.length, formatted.length);
    }
  }
  timeInput.removeAttribute('aria-invalid');
  updatePastWarning();
});
timeInput.addEventListener('blur', () => {
  normalizeTimeInput();
  updatePastWarning();
});

// Interacting with either field while "Now" is selected means the user wants
// a scheduled search; switch to "Depart at" without interrupting the control.
for (const control of [timeInput, dateInput]) {

}

// ---------------------------------------------------------------------------
// From/To fields with autocomplete and submit-time resolution
// ---------------------------------------------------------------------------

function createField({ root, input, list, getFocus, recentKey }) {
  let selected = null;
  let items = [];
  let activeIndex = -1;
  let debounceTimer = 0;
  let requestSeq = 0;
  let controller = null;
  let recents = readRecentPlaces(recentKey);
  const clearButton = root.querySelector('.clear-button');
  const gpsTag = root.querySelector('.gps-tag');

  function setGpsTag(active) {
    if (gpsTag) gpsTag.hidden = !active;
    root.classList.toggle('is-gps', active);
  }

  function syncClear() {
    if (clearButton) clearButton.hidden = input.value.length === 0;
    root.classList.toggle('has-clear', input.value.length > 0);
  }

  function clear() {
    selected = null;
    input.value = '';
    input.title = '';
    setInvalid(false);
    close();
    setGpsTag(false);
    syncClear();
    input.focus();
    showRecents();
  }

  function rememberPlace(place) {
    if (!place) return;
    const entry = normaliseRecentPlace(recentPlaceForStorage(place));
    if (!entry) return;
    const key = `${entry.label}|${entry.lat}|${entry.lon}`;
    recents = [
      entry,
      ...recents.filter((item) => `${item.label}|${item.lat}|${item.lon}` !== key),
    ].slice(0, RECENT_PLACES_LIMIT);
    writeRecentPlaces(recentKey, recents);
  }

  function showRecents() {
    if (input.value.trim() || !recents.length) return false;
    items = recents;
    renderSuggestions();
    return true;
  }

  function close() {
    clearTimeout(debounceTimer);
    controller?.abort();
    requestSeq += 1;
    items = [];
    activeIndex = -1;
    list.replaceChildren();
    list.hidden = true;
    input.setAttribute('aria-expanded', 'false');
    input.removeAttribute('aria-activedescendant');
  }

  function setActive(index) {
    activeIndex = index;
    Array.from(list.children).forEach((node, nodeIndex) => {
      node.setAttribute('aria-selected', String(nodeIndex === index));
    });
    if (index >= 0) {
      input.setAttribute('aria-activedescendant', `${list.id}-${index}`);
      list.children[index]?.scrollIntoView({ block: 'nearest' });
    } else {
      input.removeAttribute('aria-activedescendant');
    }
  }

  function renderSuggestions() {
    list.replaceChildren();
    if (!items.length) {
      close();
      return;
    }
    items.forEach((item, index) => {
      const option = el('li', 'suggestion');
      option.id = `${list.id}-${index}`;
      option.setAttribute('role', 'option');
      option.setAttribute('aria-selected', 'false');
      option.title = item.label;
      option.append(
        el('span', 'suggestion-label', item.label),
        el('span', 'suggestion-kind', item.kind || ''),
      );
      option.addEventListener('pointerdown', (event) => event.preventDefault());
      option.addEventListener('click', () => choose(index));
      list.append(option);
    });
    list.hidden = false;
    input.setAttribute('aria-expanded', 'true');
    // The first option is what Enter chooses, so highlight it by default.
    setActive(0);
  }

  function choose(index) {
    const item = items[index];
    if (!item) return;
    rememberPlace(item);
    selected = item;
    input.value = item.label;
    input.title = item.label;
    setGpsTag(false);
    syncClear();
    setInvalid(false);
    close();
    input.focus();
  }

  async function loadSuggestions(query) {
    const seq = ++requestSeq;
    controller?.abort();
    controller = new AbortController();
    try {
      const focus = getFocus() || HELSINKI_CENTER;
      const results = await geocodePlaces(query, focus, controller.signal);
      if (seq !== requestSeq || document.activeElement !== input) return;
      items = results;
      renderSuggestions();
    } catch (error) {
      if (error.name !== 'AbortError' && seq === requestSeq) close();
    }
  }

  function onInput() {
    setInvalid(false);
    input.title = '';
    syncClear();
    if (selected && input.value.trim() !== selected.label) {
      selected = null;
      setGpsTag(false);
    }

    clearTimeout(debounceTimer);
    controller?.abort();
    const query = input.value.trim();
    if (!query) {
      if (!showRecents()) close();
      return;
    }
    if (query.length < 3) {
      close();
      return;
    }
    debounceTimer = setTimeout(() => loadSuggestions(query), 220);
  }

  function onFocus() {
    if (!input.value.trim()) showRecents();
  }

  function onKeyDown(event) {
    if (list.hidden || !items.length) return;
    if (event.key === 'ArrowDown') {
      event.preventDefault();
      setActive((activeIndex + 1) % items.length);
    } else if (event.key === 'ArrowUp') {
      event.preventDefault();
      setActive(activeIndex <= 0 ? items.length - 1 : activeIndex - 1);
    } else if (event.key === 'Enter' && activeIndex >= 0) {
      event.preventDefault();
      choose(activeIndex);
    } else if (event.key === 'Escape') {
      event.preventDefault();
      close();
    } else if (event.key === 'Tab') {
      close();
    }
  }

  input.addEventListener('input', onInput);
  input.addEventListener('focus', onFocus);
  input.addEventListener('keydown', onKeyDown);
  clearButton?.addEventListener('click', clear);
  syncClear();
  setGpsTag(false);

  function setInvalid(value) {
    root.classList.toggle('is-invalid', value);
  }

  return {
    root,
    input,
    close,
    getText: () => input.value.trim(),
    getSelection() {
      if (selected && input.value.trim() === selected.label) return selected;
      return null;
    },
    setSelection(value) {
      selected = value;
      input.value = value?.label || '';
      input.title = value?.label || '';
      setGpsTag(value?.gps === true);
      syncClear();
      setInvalid(false);
      close();
      rememberPlace(value);
    },
    setValue(text, selection) {
      selected = selection && selection.label === text ? selection : null;
      input.value = text;
      input.title = text;
      setGpsTag(selected?.gps === true);
      syncClear();
      setInvalid(false);
      close();
    },
    setInvalid,
    clearInvalid: () => setInvalid(false),
    async resolve() {
      const text = input.value.trim();
      if (selected && text === selected.label) return selected;
      if (!text) return null;

      const results = await geocodePlaces(text, getFocus() || HELSINKI_CENTER);
      if (!results.length) {
        throw new Error(t('notFound', text));
      }
      const best = results[0];
      rememberPlace(best);
      selected = best;
      input.value = best.label;
      input.title = best.label;
      setGpsTag(false);
      syncClear();
      setInvalid(false);
      close();
      return best;
    },
  };
}

const fromField = createField({
  root: document.getElementById('from-field'),
  input: document.getElementById('from'),
  list: document.getElementById('from-suggestions'),
  getFocus: () => toField.getSelection(),
  recentKey: 'from',
});

const toField = createField({
  root: document.getElementById('to-field'),
  input: document.getElementById('to'),
  list: document.getElementById('to-suggestions'),
  getFocus: () => fromField.getSelection(),
  recentKey: 'to',
});

document.addEventListener('pointerdown', (event) => {
  if (!fromField.root.contains(event.target)) fromField.close();
  if (!toField.root.contains(event.target)) toField.close();
});

// ---------------------------------------------------------------------------
// Rendering
// ---------------------------------------------------------------------------

function liveBadge(withLabel) {
  const node = el('span', 'live');
  node.title = t('liveTitle');
  node.setAttribute('aria-label', t('liveAria'));
  node.append(el('span', 'live-dot'));
  if (withLabel) node.append(document.createTextNode(t('liveLabel')));
  return node;
}

function locationNode(name, point) {
  const label = String(name || '');
  const lat = Number(point?.lat);
  const lon = Number(point?.lon);
  if (!label || !Number.isFinite(lat) || !Number.isFinite(lon)) {
    return document.createTextNode(label);
  }
  const link = document.createElement('a');
  link.className = 'location-link';
  link.href = `geo:${lat},${lon}?q=${lat},${lon}(${encodeURIComponent(label)})`;
  link.textContent = label;
  return link;
}

function renderWalkDetail(leg) {
  const fragment = document.createDocumentFragment();
  const target = leg.to?.name;
  const distance = Number(leg.distance) > 20 ? ` · ${formatDistance(leg.distance)}` : '';
  if (!target || target === 'Destination') {
    fragment.append(document.createTextNode(t('walkToDestination')));
  } else {
    fragment.append(document.createTextNode(t('walkToPrefix')), locationNode(target, leg.to));
  }
  if (distance) fragment.append(document.createTextNode(distance));
  return fragment;
}

function renderTransitDetail(leg) {
  const from = leg.from?.name || t('stopFallback');
  const to = leg.to?.name || t('stopFallback');
  const platform = leg.from?.stop?.platformCode;
  const fragment = document.createDocumentFragment();
  fragment.append(locationNode(from, leg.from));
  if (platform) fragment.append(document.createTextNode(t('platform', platform)));
  fragment.append(document.createTextNode(' → '), locationNode(to, leg.to));
  return fragment;
}

/** Identify the service and its destination below the stop pair. */
function renderTransitLine(leg, info) {
  const mode = leg.route?.mode || leg.mode;
  const line = leg.route?.shortName || leg.route?.longName || '';
  const headsign = leg.trip?.tripHeadsign || '';
  const withHeadsign = (label) => (headsign ? `${label} (${headsign})` : label);

  if (!line) return headsign ? `→ ${headsign}` : info.label;
  if (mode === 'RAIL') return withHeadsign(t('railLine', line));
  if (mode === 'BUS') return withHeadsign(t('busLine', line));
  if (mode === 'TRAM') return withHeadsign(t('tramLine', line));
  if (mode === 'SUBWAY') return withHeadsign(line);
  if (mode === 'FERRY') return withHeadsign(t('ferryLine', line));
  return headsign ? `→ ${headsign}` : line;
}

function renderStep(leg) {
  const isWalk = leg.mode === 'WALK' || !leg.transitLeg;
  const step = el('li', 'step');
  const marker = el('span', 'step-marker');
  const body = el('div', 'step-body');

  if (isWalk) {
    const circle = el('span', 'walk-marker');
    circle.append(icon('icon-walk'));
    marker.append(circle);
    const detail = el('div', 'step-detail');
    detail.append(renderWalkDetail(leg));
    body.append(el('div', 'step-title', t('walk')), detail);
  } else {
    const mode = leg.route?.mode || leg.mode;
    const info = modeInfo(mode);
    const line = leg.route?.shortName || leg.route?.longName || info.label;
    const badge = el('span', `line-badge ${info.className}`, line);
    badge.title = `${info.label} ${line}`;
    marker.append(badge);

    const title = el('div', 'step-title');
    title.append(renderTransitDetail(leg));
    body.append(title, el('div', 'step-detail', renderTransitLine(leg, info)));
  }

  step.append(marker, body);

  const timing = el('div', 'step-timing');
  if (!isWalk && leg.realTime) timing.append(liveBadge(false));
  timing.append(
    el('span', 'step-duration', formatDuration(leg.duration)),
    el('span', 'step-time', formatTime(leg.startTime)),
  );
  step.append(timing);
  return step;
}

function renderWaitRow(seconds, stop) {
  const step = el('li', 'step step-wait');
  step.append(el('span', 'step-marker'));
  const body = el('div', 'step-body');
  const detail = el('div', 'step-detail');
  detail.append(document.createTextNode(t('waitAtPrefix', formatDuration(seconds))));
  if (stop?.name) {
    detail.append(document.createTextNode(t('waitAtSeparator')), locationNode(stop.name, stop));
  }
  body.append(detail);
  step.append(body);
  return step;
}

function renderItinerary(itinerary) {
  const legs = Array.isArray(itinerary.legs) ? itinerary.legs : [];

  const card = el('article', 'itinerary');
  card.dataset.key = itineraryKey(itinerary);

  const head = el('div', 'itinerary-head');
  const times = el('div', 'itinerary-times');
  const arrow = el('span', 'itinerary-arrow', '→');
  arrow.setAttribute('aria-hidden', 'true');
  const crossesMidnight = formatDay(itinerary.startTime) !== formatDay(itinerary.endTime);
  times.append(
    el('span', '', formatTime(itinerary.startTime)),
    arrow,
    el('span', '', `${formatTime(itinerary.endTime)}${crossesMidnight ? ' +1' : ''}`),
  );
  head.append(times);

  const dayLabel = relativeDayLabel(itinerary.startTime);
  const hasLive = legs.some((leg) => leg.realTime);
  if (dayLabel || hasLive) {
    const meta = el('p', 'itinerary-meta');
    if (dayLabel) meta.append(document.createTextNode(dayLabel));
    if (hasLive) {
      if (dayLabel) meta.append(document.createTextNode(' '), el('span', 'meta-dot'));
      meta.append(liveBadge(true));
    }
    head.append(meta);
  }

  head.append(el('div', 'itinerary-duration', formatDuration(itinerary.duration)));
  card.append(head);

  const steps = el('ol', 'steps');
  let previousEnd = null;
  for (const leg of legs) {
    if (leg.transitLeg && previousEnd !== null) {
      // leg times are epoch milliseconds; durations are seconds.
      const waitSeconds = (Number(leg.startTime) - previousEnd) / 1000;
      if (Number.isFinite(waitSeconds) && waitSeconds >= 60) {
        steps.append(renderWaitRow(waitSeconds, leg.from));
      }
    }
    steps.append(renderStep(leg));
    previousEnd = Number(leg.endTime);
  }
  card.append(steps);

  return card;
}

function itineraryKey(itinerary) {
  const legs = Array.isArray(itinerary.legs) ? itinerary.legs : [];
  return `${Number(itinerary.startTime)}-${Number(itinerary.endTime)}-${legs
    .map((leg) => `${leg.mode}:${leg.route?.shortName || ''}:${Number(leg.startTime)}`)
    .join(',')}`;
}

function renderPager(position) {
  const pager = el('div', `pager pager-${position}`);
  for (const direction of ['earlier', 'later']) {
    const button = el('button', 'pager-button');
    button.type = 'button';
    button.dataset.direction = direction;
    const verb = direction === 'earlier' ? t('earlierAria') : t('laterAria');
    button.setAttribute(
      'aria-label',
      position === 'bottom' ? t('atEnd', verb) : verb,
    );
    pager.append(button);
  }
  if (position === 'bottom') {
    const link = el('a', 'pager-hsl-link');
    link.href = hslSearchUrl();
    link.target = '_blank';
    link.rel = 'noreferrer';
    link.title = t('openInHsl');
    link.setAttribute('aria-label', t('openInHsl'));
    link.append(icon('icon_hsl_loop'));
    pager.append(link);
  }
  return pager;
}

function hslSearchUrl() {
  if (!activeSearch?.from || !activeSearch?.to) return 'https://reittiopas.hsl.fi/';
  const placeSegment = (place) => {
    const label = place.label || place.name || `${place.lat},${place.lon}`;
    return encodeURIComponent(`${label}::${place.lat},${place.lon}`);
  };
  const params = new URLSearchParams();
  const first = currentItineraries[0];
  let epoch = Math.floor(Date.now() / 1000);
  if (activeSearch.timing?.date && activeSearch.timing?.time && first) {
    const anchor = activeSearch.arriveBy ? first.endTime : first.startTime;
    if (Number.isFinite(Number(anchor))) epoch = Math.floor(Number(anchor) / 1000);
  }
  params.set('time', String(epoch));
  if (activeSearch.arriveBy) params.set('arriveBy', 'true');
  return `https://reittiopas.hsl.fi/reitti/${placeSegment(activeSearch.from)}/${placeSegment(activeSearch.to)}/?${params}`;
}

function updatePagerButtons() {
  for (const button of resultsBox.querySelectorAll('.pager-button')) {
    const direction = button.dataset.direction;
    const exhausted = pagingExhausted[direction];
    button.disabled = paging || exhausted;
    if (exhausted) {
      button.textContent = direction === 'earlier' ? t('noEarlier') : t('noLater');
    } else {
      button.textContent = direction === 'earlier' ? t('showEarlier') : t('showLater');
    }
  }
}

function renderItineraries(itineraries, { focusKey = null } = {}) {
  const visible = filterItinerariesByModes(itineraries);
  if (!visible.length) {
    resultsBox.hidden = true;
    showStatus(t('noModeMatch'), 'info');
    return;
  }

  resultsBox.replaceChildren();

  const head = el('div', 'results-head');
  head.append(el('h2', 'visually-hidden', t('resultsRoutes')));

  const list = el('div', 'itinerary-list');
  for (const itinerary of visible) {
    list.append(renderItinerary(itinerary));
  }
  head.append(renderPager('top'));
  resultsBox.append(head, list, renderPager('bottom'));
  resultsBox.hidden = false;
  statusBox.hidden = true;
  updatePagerButtons();

  if (focusKey) {
    requestAnimationFrame(() => {
      const target = Array.from(resultsBox.querySelectorAll('.itinerary')).find(
        (node) => node.dataset.key === focusKey,
      );
      if (!target) return;
      const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      target.scrollIntoView({ behavior: reduceMotion ? 'auto' : 'smooth', block: 'center' });
    });
  }
}

async function showMore(direction) {
  if (busy || paging || !activeSearch || !currentItineraries.length) return;
  if (pagingExhausted[direction]) return;

  paging = true;
  routeButton.disabled = true;
  resultsBox.setAttribute('aria-busy', 'true');
  updatePagerButtons();

  try {
    const visible = filterItinerariesByModes(currentItineraries);
    const anchorSource = visible.length ? visible : currentItineraries;
    const starts = anchorSource.map((itinerary) => Number(itinerary.startTime));
    const ends = anchorSource.map((itinerary) => Number(itinerary.endTime));
    const minStart = Math.min(...starts);
    const maxStart = Math.max(...starts);
    const minEnd = Math.min(...ends);
    const maxEnd = Math.max(...ends);

    let anchorMs;
    let queryArriveBy;
    if (direction === 'later') {
      queryArriveBy = Boolean(activeSearch.arriveBy);
      anchorMs = queryArriveBy ? maxEnd + 10 * 60 * 1000 : maxStart + 60 * 1000;
    } else {
      // An arrive-by search at the earliest arrival returns the previous
      // departures, whereas a depart-at search would keep moving forward.
      queryArriveBy = true;
      anchorMs = minEnd - 60 * 1000;
    }

    const timing = {
      date: dayFormatter.format(new Date(anchorMs)),
      time: `${timeFormatter.format(new Date(anchorMs))}:00`,
      arriveBy: queryArriveBy,
    };

    const data = await requestPlan(
      activeSearch.from,
      activeSearch.to,
      timing,
      activeSearch.options,
    );
    const existingKeys = new Set(currentItineraries.map(itineraryKey));
    const additions = (Array.isArray(data?.itineraries) ? data.itineraries : []).filter(
      (itinerary) => {
        const start = Number(itinerary.startTime);
        if (!Number.isFinite(start)) return false;
        if (existingKeys.has(itineraryKey(itinerary))) return false;
        return direction === 'later' ? start > maxStart : start < minStart;
      },
    );

    if (!additions.length) {
      pagingExhausted[direction] = true;
      return;
    }

    const merged = [...currentItineraries, ...additions].sort(
      (a, b) => Number(a.startTime) - Number(b.startTime),
    );
    const newKeys = new Set(additions.map(itineraryKey));
    const firstNew = merged.find((itinerary) => newKeys.has(itineraryKey(itinerary)));

    currentItineraries = merged;
    renderItineraries(merged, { focusKey: firstNew ? itineraryKey(firstNew) : null });
  } catch (error) {
    if (STANDALONE && error.code === 'AUTH') openKeyDialog();
    showStatus(error.message, 'error');
  } finally {
    paging = false;
    routeButton.disabled = false;
    resultsBox.setAttribute('aria-busy', 'false');
    updatePagerButtons();
    if (pendingOptionSearch) {
      pendingOptionSearch = false;
      form.requestSubmit();
    }
  }
}

resultsBox.addEventListener('click', (event) => {
  const button = event.target.closest('.pager-button');
  if (!button || button.disabled) return;
  showMore(button.dataset.direction);
});

// ---------------------------------------------------------------------------
// Search flow
// ---------------------------------------------------------------------------

function updateUrl(from, to) {
  try {
    const params = new URLSearchParams();
    if (from && !from.gps) params.set('from', from.label);
    if (to) params.set('to', to.label);
    const query = params.toString();
    history.replaceState(null, '', query ? `?${query}` : location.pathname);
  } catch {
    // file:// and sandboxed contexts may refuse history updates. Not fatal.
  }
}

async function submitSearch() {
  if (busy || paging) return;
  const id = ++runId;
  clearTimeout(optionSearchTimer);
  pendingOptionSearch = false;

  fromField.close();
  toField.close();
  fromField.input.blur();
  toField.input.blur();
  fromField.clearInvalid();
  toField.clearInvalid();

  if (!toField.getText() && !toField.getSelection()) {
    toField.setInvalid(true);
    toField.input.focus();
    showError(t('enterDestination'));
    return;
  }

  let when;
  try {
    normalizeTimeInput();
    updatePastWarning();
    when = computeWhen(true);
    timeInput.removeAttribute('aria-invalid');
    dateInput.removeAttribute('aria-invalid');
  } catch (error) {
    if (error.field === 'date') {
      dateInput.setAttribute('aria-invalid', 'true');
      dateInput.focus();
    } else {
      timeInput.setAttribute('aria-invalid', 'true');
      timeInput.focus();
    }
    showError(error.message);
    return;
  }

  if (STANDALONE && !apiKey) {
    openKeyDialog();
    showError(t('addApiKey'));
    return;
  }

  hasSearched = true;
  resultsBox.hidden = true;
  activeSearch = null;
  currentItineraries = [];
  pagingExhausted = { earlier: false, later: false };
  setBusy(true);

  try {
    showStatus(
      fromField.getText() ? t('findingLocations') : t('gettingLocation'),
      'loading',
    );

    const [from, to] = await Promise.all([
      (async () => {
        const existing = fromField.getSelection();
        if (existing) return existing;
        if (!fromField.getText()) {
          const gps = await locateSelection();
          fromField.setSelection(gps);
          return gps;
        }
        return fromField.resolve();
      })().catch((error) => {
        error.field = 'from';
        throw error;
      }),
      (async () => {
        const existing = toField.getSelection();
        if (existing) return existing;
        const resolved = await toField.resolve();
        if (!resolved) throw new Error(t('enterDestination'));
        return resolved;
      })().catch((error) => {
        error.field = 'to';
        throw error;
      }),
    ]);
    if (id !== runId) return;

    showStatus(t('planningRoute'), 'loading');
    const options = getSearchOptions();
    const data = await requestPlan(from, to, when, options);
    if (id !== runId) return;

    const itineraries = (Array.isArray(data?.itineraries) ? data.itineraries : [])
      .slice()
      .sort((a, b) => Number(a.startTime) - Number(b.startTime));
    if (!itineraries.length) {
      showStatus(t('noRoutesFound'), 'info');
      return;
    }

    activeSearch = {
      from,
      to,
      arriveBy: Boolean(when.arriveBy),
      timing: when,
      options,
    };
    currentItineraries = itineraries;
    renderItineraries(itineraries);
    updateUrl(from, to);
  } catch (error) {
    if (id !== runId) return;
    if (error.field === 'from') {
      fromField.setInvalid(true);
      fromField.input.focus();
    } else if (error.field === 'to') {
      toField.setInvalid(true);
      toField.input.focus();
    }
    showError(error.message);
    if (STANDALONE && (error.code === 'AUTH' || error.code === 'NO_KEY')) openKeyDialog();
  } finally {
    if (id === runId) {
      setBusy(false);
      if (pendingOptionSearch) {
        pendingOptionSearch = false;
        form.requestSubmit();
      }
    }
  }
}

form.addEventListener('submit', (event) => {
  event.preventDefault();
  submitSearch();
});

locateButton.addEventListener('click', async () => {
  if (busy || locateButton.disabled) return;
  locateButton.disabled = true;
  showStatus(t('gettingLocation'), 'loading');
  try {
    const selection = await locateSelection();
    fromField.setSelection(selection);
    fromField.input.blur();
    statusBox.hidden = true;
  } catch (error) {
    showStatus(error.message, 'error');
  } finally {
    locateButton.disabled = busy;
  }
});

swapButton.addEventListener('click', () => {
  if (busy) return;
  const fromText = fromField.getText();
  const fromSelection = fromField.getSelection();
  const toText = toField.getText();
  const toSelection = toField.getSelection();

  fromField.setValue(toText, toSelection);
  toField.setValue(fromText, fromSelection);
  fromField.clearInvalid();
  toField.clearInvalid();
  fromField.input.focus();
});

// Shareable URLs: ?from=Kamppi&to=Pasila. Only auto-route when both are set,
// so loading a destination-only link never triggers a location prompt.
const initialParams = new URLSearchParams(location.search);
const initialFrom = (initialParams.get('from') || '').trim();
const initialTo = (initialParams.get('to') || '').trim();
if (initialFrom) fromField.setValue(initialFrom, null);
if (initialTo) toField.setValue(initialTo, null);
if (initialFrom && initialTo) {
  if (STANDALONE && !apiKey) pendingAutoRoute = true;
  else setTimeout(() => form.requestSubmit(), 0);
}
